<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="../styles/contactus.css">
</head>
<body>
  
    <div class="contact">
        <div class="container">
            <h1>Contact With Us</h1>
            <p class="wrapper">Have questions or need help?. Send us a message and we'll get back to you soon.</p>

            <div class="cont-card">
                <form>
                    <div class="form">
                        <label>Name</label>
                        <input type="text" placeholder="Your name">
                    </div>
                    
                    <div class="form">
                        <label>Email</label>
                        <input type="email" placeholder="your@email.com">
                    </div>
                    
                    <div class="form">
                        <label>Message</label>
                        <textarea rows="4" placeholder="How can we help you?"></textarea>
                    </div>
                    
                    <button type="submit">Send Message</button>
                </form>
            </div>
            

            <div class="info">
                <div class="item">
                    <div class="icon">📧</div>
                    <h3>Email</h3>
                    <p>oursupport@gmail.com</p>
                </div>
                
                <div class="item">
                    <div class="icon">📞</div>
                    <h3>Phone</h3>
                    <p>+91 9655678900</p>
                </div>
                
                <div class="item">
                    <div class="icon">📍</div>
                    <h3>Address</h3>
                    <p> Hyderabad, India</p>
                </div>
            </div>
        </div>
    </div>
    <footer>
            <p>© 2026 EcommerceWebsite. All rights reserved.</p>
    </footer>
</body>
</html>
