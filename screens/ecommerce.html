<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="../styles/ecommerce.css">
</head>
<body>

<div class="header"><h1>CART</h1></div>

<div class="container">


    <div class="card" style="width:70%;">

        <div class="product">
            <img src="../assets/cartimages/iphone 17.jpg">
            <div>
                <h4>Apple iPhone 17 Pro Max</h4>
                <p>512 GB, Cosmic Orange</p>
                <p class="price">₹1,69,900</p>

                <div class="qty-box">
                    <button class="qty-btn">-</button>
                    <div class="qty-number">1</div>
                    <button class="qty-btn">+</button>
                </div>

                <div class="cart-actions">
                    <button class="action-btn">Save for later</button>
                    <button class="action-btn">Remove</button>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        
        <div class="product">
            <img src="../assets/cartimages/frock.jpg">
            <div>
                <h4>Red hearts printed frock</h4>
                <p>cotton, white red combo</p>
                <p class="price">₹1,599</p>

                <div class="qty-box">
                    <button class="qty-btn">-</button>
                    <div class="qty-number">1</div>
                    <button class="qty-btn">+</button>
                </div>

                <div class="cart-actions">
                    <button class="action-btn">Save for later</button>
                    <button class="action-btn">Remove</button>
                </div>
            </div>
        </div>

    </div>

    
    <div class="card summary">
        <p>Price (2 items): ₹1,71,499</p>
        <p>Delivery Charges: Free</p>
        <p class="total">Total: ₹1,71,499</p>

        <a href="address.html" class="btn">Place Order</a>
    </div>

</div>

</body>
</html>
